<!doctype html>
<html>
  <head>
    <title>Preview</title>
    <style>
      html,
      body,
      iframe {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://opensciencedata.esa.int/stac-browser/#/"
      frameborder="0"
    ></iframe>
    <script>
      let contentProvided;
      // Listen for messages from parent
      window.onload = () => {
        const iframeWindow = document.querySelector("iframe").contentWindow;
        window.addEventListener("message", (event) => {
          iframeWindow.postMessage({ data: event.data.detail }, "*");
          contentProvided = true;
        });
        setTimeout(() => {
          if (contentProvided) {
            return;
          }
          // Init with dummy content
          iframeWindow.postMessage(
            {
              data: {
                id: "",
                description: "Update the form to view the live preview",
              },
            },
            "*",
          );
          contentProvided = true;
        }, 1000);
      };
    </script>
  </body>
</html>
